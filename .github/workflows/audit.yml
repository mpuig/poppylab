# Advisories for the production dependencies, kept apart from Checks so a
# registry outage fails only this workflow. The daily run catches an
# advisory published after the last push; a failed run is GitHub's
# notification. `pnpm audit` reads the lockfile, so nothing is installed.
name: Audit
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
concurrency:
  # One group per pull request; on main, one per commit, so no push waits
  # behind another or is dropped while it waits.
  group: audit-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm audit --prod --audit-level high
