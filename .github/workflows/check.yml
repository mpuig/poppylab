# A pull request runs once per commit (not again as a branch push), and a
# newer commit cancels its older run. Every push to main runs to the end, so
# main's history of runs stays complete. Dependency advisories are checked
# in audit.yml, so a registry outage there leaves these results alone.
name: Checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  # One group per pull request; on main, one per commit, so no push waits
  # behind another or is dropped while it waits.
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Fast checks that run no tests and build nothing.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm learn:diagrams:check
      # Lists the groups after checking every test file they name exists.
      - run: pnpm scenarios --list
      - run: pnpm typecheck
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      # Tests and builds regenerate committed files (each Company's
      # src/site/app-script.ts, packages/pap-agent/openapi.json); a stale
      # copy shows up here as a change or a new file.
      - name: Committed generated files are current
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::Generated files differ from the commit. Run pnpm test and pnpm build, then commit the result."
            exit 1
          fi
  # The playground's Cloudflare bundle, as deploy:worker would upload it:
  # the OpenNext build and the secret scan. Nothing is deployed and the job
  # has no secrets, so the scan finds no local values to look for; it still
  # fails on any .env*, .dev.vars* or .poppy file inside the bundle.
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @poppy-lab/playground build:worker
  # The browser scenario (`pnpm e2e`): one long conversation in Chromium, in
  # the real playground, against the local Companies and a scripted model,
  # with no network, keys or Turnstile. Not a required check. A failure
  # keeps the trace, the screenshot and each server's log.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @poppy-lab/playground exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system libraries
        if: steps.chromium.outputs.cache-hit != 'true'
        run: pnpm --filter @poppy-lab/playground exec playwright install --with-deps --only-shell chromium
      - name: Install Chromium's system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        run: pnpm --filter @poppy-lab/playground exec playwright install-deps chromium
      # The Companies' local names, for the playground's server, which
      # resolves them through the system.
      - name: Local Company names
        run: echo "127.0.0.1 fernwick.localhost noodles.localhost" | sudo tee -a /etc/hosts
      - run: pnpm e2e
      - name: Keep the trace, screenshots and server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: apps/playground/test-results/
          retention-days: 14
