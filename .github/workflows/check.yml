# A pull request runs once per commit (not again as a branch push), and a
# newer commit cancels its older run. Every push to main runs to the end, so
# main's history of runs stays complete.
name: Checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm learn:diagrams:check
      # Lists the groups after checking every test file they name exists.
      - run: pnpm scenarios --list
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Tests and builds regenerate committed files (each Company's
      # src/site/app-script.ts, packages/pap-agent/openapi.json); a stale
      # copy shows up here as a change or a new file.
      - name: Committed generated files are current
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::Generated files differ from the commit. Run pnpm test and pnpm build, then commit the result."
            exit 1
          fi
      - run: pnpm audit --prod --audit-level high
