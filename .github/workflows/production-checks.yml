# What a visitor to poppylab.dev sees, checked every hour and on demand
# (scripts/smoke/production.ts), signed out and signed in at one Company.
# It declines its proposal and signs out: nothing is approved. A failed run
# is GitHub's notification.
# Deploys are made with Wrangler from a workstation, not from a push, so a
# push to main says nothing about production: there is no push trigger.
# Run it by hand after a deploy (`gh workflow run production-checks.yml`).
name: Production checks
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      all_media:
        description: Check every Learn media file, not this hour's third
        type: boolean
        default: false
concurrency:
  group: production-checks
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke:production ${{ inputs.all_media && '--all-media' || '' }}
