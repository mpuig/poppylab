# Weekly, grouped updates. pnpm-workspace.yaml sets minimumReleaseAge to one
# day, so pnpm refuses a version published less than a day ago; the cooldown
# waits longer than that, and longer still for a major version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 14
    # A major version comes in a pull request of its own, so one that
    # breaks the build doesn't hold back the others.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint doesn't support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The types follow the Node version the lab runs (.node-version).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5
