# Weekly, grouped updates. pnpm-workspace.yaml sets minimumReleaseAge to one
# day, so pnpm refuses a version published less than a day ago; the cooldown
# waits longer than that, and longer still for a major version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
    open-pull-requests-limit: 3
