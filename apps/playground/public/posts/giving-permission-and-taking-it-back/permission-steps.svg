<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 468" font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">
  <rect x="1" y="1" width="420" height="58" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="15" y="27" font-size="15" font-weight="600" fill="#171a1f">Signed out</text>
  <text x="15" y="46" font-size="14" font-weight="400" fill="#5b626c">public questions only, such as what Juniper sells</text>
  <path d="M25 59L25 99" fill="none" stroke="#0d5c4a" stroke-width="1.5"/>
  <path d="M25 107L20.5 99L29.5 99Z" fill="#0d5c4a"/>
  <rect x="41" y="69" width="364.96" height="28" rx="4" fill="#fff6d6" stroke="#f2b705" stroke-width="1"/>
  <text x="223.48" y="87.9" text-anchor="middle" font-size="14" font-weight="600" fill="#171a1f">Elena signs in and allows, on Juniper's page</text>
  <rect x="1" y="107" width="420" height="76" rx="6" fill="#ffffff" stroke="#0d5c4a" stroke-width="1.2"/>
  <text x="15" y="133" font-size="15" font-weight="600" fill="#171a1f">Read</text>
  <text x="15" y="152" font-size="14" font-weight="400" fill="#5b626c">a token with poppy:read, and Propose changes: None.</text>
  <text x="15" y="170" font-size="14" font-weight="400" fill="#5b626c">Iris doesn't send the delivery move at all.</text>
  <path d="M25 183L25 223" fill="none" stroke="#0d5c4a" stroke-width="1.5"/>
  <path d="M25 231L20.5 223L29.5 223Z" fill="#0d5c4a"/>
  <rect x="41" y="193" width="286.56" height="28" rx="4" fill="#fff6d6" stroke="#f2b705" stroke-width="1"/>
  <text x="184.28" y="211.9" text-anchor="middle" font-size="14" font-weight="600" fill="#171a1f">Elena allows change permission too</text>
  <rect x="1" y="231" width="420" height="94" rx="6" fill="#ffffff" stroke="#0d5c4a" stroke-width="1.2"/>
  <text x="15" y="257" font-size="15" font-weight="600" fill="#171a1f">Read and propose changes</text>
  <text x="15" y="276" font-size="14" font-weight="400" fill="#5b626c">poppy:read and poppy:write on one consent screen,</text>
  <text x="15" y="294" font-size="14" font-weight="400" fill="#5b626c">replacing the old grant. Each change still waits</text>
  <text x="15" y="312" font-size="14" font-weight="400" fill="#5b626c">for her approval.</text>
  <path d="M25 325L25 365" fill="none" stroke="#0d5c4a" stroke-width="1.5"/>
  <path d="M25 373L20.5 365L29.5 365Z" fill="#0d5c4a"/>
  <text x="41" y="354" font-size="14" font-weight="400" fill="#5b626c">Sign out in Iris, or Disconnect on Juniper's site</text>
  <rect x="1" y="373" width="420" height="94" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="15" y="399" font-size="15" font-weight="600" fill="#171a1f">Disconnected</text>
  <text x="15" y="418" font-size="14" font-weight="400" fill="#5b626c">the refresh and access tokens end, Iris drops back</text>
  <text x="15" y="436" font-size="14" font-weight="400" fill="#5b626c">to public access, and the moved delivery stays</text>
  <text x="15" y="454" font-size="14" font-weight="400" fill="#5b626c">moved</text>
  <rect x="453" y="125" width="266" height="130" rx="6" fill="none" stroke="#c9ced5" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="467" y="151" font-size="15" font-weight="600" fill="#171a1f">Narrower than scopes</text>
  <text x="467" y="170" font-size="14" font-weight="400" fill="#5b626c">At Harborline and Fernwick,</text>
  <text x="467" y="188" font-size="14" font-weight="400" fill="#5b626c">Elena also picks which accounts</text>
  <text x="467" y="206" font-size="14" font-weight="400" fill="#5b626c">or meters to share. The rest</text>
  <text x="467" y="224" font-size="14" font-weight="400" fill="#5b626c">answer 404 on every channel, as</text>
  <text x="467" y="242" font-size="14" font-weight="400" fill="#5b626c">if they didn't exist.</text>
  <rect x="453" y="337" width="266" height="130" rx="6" fill="none" stroke="#c9ced5" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="467" y="363" font-size="15" font-weight="600" fill="#171a1f">Ended from either side</text>
  <text x="467" y="382" font-size="14" font-weight="400" fill="#5b626c">Sign out in Iris sends POST</text>
  <text x="467" y="400" font-size="14" font-weight="400" fill="#5b626c">/oauth/revoke. Disconnect on</text>
  <text x="467" y="418" font-size="14" font-weight="400" fill="#5b626c">Juniper's website revokes the</text>
  <text x="467" y="436" font-size="14" font-weight="400" fill="#5b626c">grant from the company's side,</text>
  <text x="467" y="454" font-size="14" font-weight="400" fill="#5b626c">and Iris's next request fails.</text>
</svg>
