<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720.5999999999999" font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">
  <text x="1" y="17" font-size="14" font-weight="600" fill="#171a1f">Harborline Bank</text>
  <rect x="1" y="29" width="358" height="130.2" rx="6" fill="#ffffff" stroke="#0d5c4a" stroke-width="1.2"/>
  <text x="13" y="52.2" font-size="14" font-weight="600" fill="#171a1f">poppylab.dev/fdx v1</text>
  <text x="13" y="70.2" font-size="13" font-weight="400" fill="#5b626c">FDX consent clusters as scopes, such as</text>
  <text x="13" y="87.2" font-size="13" font-weight="400" fill="#5b626c">fdx:TRANSACTIONS</text>
  <text x="13" y="109.2" font-size="13" font-weight="400" fill="#5b626c">accounts chosen at consent, with a consent_id</text>
  <text x="13" y="126.2" font-size="13" font-weight="400" fill="#5b626c">tied to the grant</text>
  <text x="13" y="148.2" font-size="13" font-weight="400" fill="#5b626c">JSON at /fdx/v6</text>
  <text x="1" y="191.2" font-size="14" font-weight="600" fill="#171a1f">Fernwick Power &amp; Light</text>
  <rect x="1" y="203.2" width="358" height="113.2" rx="6" fill="#ffffff" stroke="#0d5c4a" stroke-width="1.2"/>
  <text x="13" y="226.4" font-size="14" font-weight="600" fill="#171a1f">poppylab.dev/espi v1</text>
  <text x="13" y="244.4" font-size="13" font-weight="400" fill="#5b626c">espi:usage, espi:summary and espi:customer as</text>
  <text x="13" y="261.4" font-size="13" font-weight="400" fill="#5b626c">scopes</text>
  <text x="13" y="283.4" font-size="13" font-weight="400" fill="#5b626c">meters chosen at consent</text>
  <text x="13" y="305.4" font-size="13" font-weight="400" fill="#5b626c">Atom XML, with no OpenAPI file</text>
  <text x="1" y="348.4" font-size="14" font-weight="600" fill="#171a1f">Lantern Noodle Bar</text>
  <rect x="1" y="360.4" width="358" height="69.2" rx="6" fill="none" stroke="#c9ced5" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="13" y="383.6" font-size="14" font-weight="600" fill="#171a1f">No extension</text>
  <text x="13" y="401.6" font-size="13" font-weight="400" fill="#5b626c">its menu and orders need no shared standard:</text>
  <text x="13" y="418.6" font-size="13" font-weight="400" fill="#5b626c">OpenAPI and MCP describe them</text>
  <rect x="1" y="449.6" width="358" height="150" rx="8" fill="#eaf3f0" stroke="#0d5c4a" stroke-width="1.2"/>
  <text x="17" y="476.6" font-size="15" font-weight="600" fill="#0d5c4a">Poppy's core, the same at every company</text>
  <rect x="17" y="493.6" width="158" height="40" rx="6" fill="#ffffff" stroke="#0d5c4a" stroke-width="1.2"/>
  <text x="96" y="518.5" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">Discovery</text>
  <rect x="185" y="493.6" width="158" height="40" rx="6" fill="#ffffff" stroke="#0d5c4a" stroke-width="1.2"/>
  <text x="264" y="518.5" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">Identity</text>
  <rect x="17" y="543.6" width="158" height="40" rx="6" fill="#ffffff" stroke="#0d5c4a" stroke-width="1.2"/>
  <text x="96" y="568.5" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">OAuth consent</text>
  <rect x="185" y="543.6" width="158" height="40" rx="6" fill="#ffffff" stroke="#0d5c4a" stroke-width="1.2"/>
  <text x="264" y="568.5" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">Sessions</text>
  <text x="1" y="623.6" font-size="13" font-weight="400" fill="#5b626c">An agent declares an extension in Poppy-Extensions</text>
  <text x="1" y="640.6" font-size="13" font-weight="400" fill="#5b626c">on every request; without it, 403</text>
  <text x="1" y="657.6" font-size="13" font-weight="400" fill="#5b626c">extension_required.</text>
  <text x="1" y="678.6" font-size="13" font-weight="400" fill="#5b626c">Both extensions only read. Moving money and</text>
  <text x="1" y="695.6" font-size="13" font-weight="400" fill="#5b626c">switching plans stay behind Operations v3</text>
  <text x="1" y="712.6" font-size="13" font-weight="400" fill="#5b626c">approvals.</text>
</svg>
