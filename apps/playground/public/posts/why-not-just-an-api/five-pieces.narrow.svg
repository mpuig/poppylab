<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 822" font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">
  <line x1="1" y1="1" x2="359" y2="1" stroke="#c9ced5" stroke-width="1"/>
  <text x="1" y="25" font-size="15" font-weight="600" fill="#171a1f">Finding you</text>
  <text x="1" y="45" font-size="13" font-weight="600" fill="#5b626c">A partner API</text>
  <text x="1" y="63" font-size="14" font-weight="400" fill="#5b626c">a developer reads your docs and copies your</text>
  <text x="1" y="81" font-size="14" font-weight="400" fill="#5b626c">URLs</text>
  <rect x="1" y="93" width="358" height="70" rx="8" fill="#eaf3f0" stroke="#0d5c4a" stroke-width="1"/>
  <text x="13" y="113" font-size="13" font-weight="600" fill="#0d5c4a">With Poppy</text>
  <text x="13" y="131" font-size="14" font-weight="400" fill="#171a1f">one poppy.json on your domain lists every</text>
  <text x="13" y="149" font-size="14" font-weight="400" fill="#171a1f">interface, scope and scope hint</text>
  <line x1="1" y1="179" x2="359" y2="179" stroke="#e3e6ea" stroke-width="1"/>
  <text x="1" y="203" font-size="15" font-weight="600" fill="#171a1f">Who is calling</text>
  <text x="1" y="223" font-size="13" font-weight="600" fill="#5b626c">A partner API</text>
  <text x="1" y="241" font-size="14" font-weight="400" fill="#5b626c">a client ID and secret issued in your portal</text>
  <rect x="1" y="253" width="358" height="70" rx="8" fill="#eaf3f0" stroke="#0d5c4a" stroke-width="1"/>
  <text x="13" y="273" font-size="13" font-weight="600" fill="#0d5c4a">With Poppy</text>
  <text x="13" y="291" font-size="14" font-weight="400" fill="#171a1f">a client_id that is an HTTPS URL hosting</text>
  <text x="13" y="309" font-size="14" font-weight="400" fill="#171a1f">the agent's keys, with no registration</text>
  <line x1="1" y1="339" x2="359" y2="339" stroke="#e3e6ea" stroke-width="1"/>
  <text x="1" y="363" font-size="15" font-weight="600" fill="#171a1f">Before and after sign-in</text>
  <text x="1" y="383" font-size="13" font-weight="600" fill="#5b626c">A partner API</text>
  <text x="1" y="401" font-size="14" font-weight="400" fill="#5b626c">anonymous requests until a login</text>
  <rect x="1" y="413" width="358" height="70" rx="8" fill="#eaf3f0" stroke="#0d5c4a" stroke-width="1"/>
  <text x="13" y="433" font-size="13" font-weight="600" fill="#0d5c4a">With Poppy</text>
  <text x="13" y="451" font-size="14" font-weight="400" fill="#171a1f">a Session from the first request; consent</text>
  <text x="13" y="469" font-size="14" font-weight="400" fill="#171a1f">on your own page, revocable agent by agent</text>
  <line x1="1" y1="499" x2="359" y2="499" stroke="#e3e6ea" stroke-width="1"/>
  <text x="1" y="523" font-size="15" font-weight="600" fill="#171a1f">Changes</text>
  <text x="1" y="543" font-size="13" font-weight="600" fill="#5b626c">A partner API</text>
  <text x="1" y="561" font-size="14" font-weight="400" fill="#5b626c">trusts that the caller's screen showed the</text>
  <text x="1" y="579" font-size="14" font-weight="400" fill="#5b626c">real price</text>
  <rect x="1" y="591" width="358" height="70" rx="8" fill="#eaf3f0" stroke="#0d5c4a" stroke-width="1"/>
  <text x="13" y="611" font-size="13" font-weight="600" fill="#0d5c4a">With Poppy</text>
  <text x="13" y="629" font-size="14" font-weight="400" fill="#171a1f">approval_required with your exact terms;</text>
  <text x="13" y="647" font-size="14" font-weight="400" fill="#171a1f">runs once, and only for that revision</text>
  <line x1="1" y1="677" x2="359" y2="677" stroke="#e3e6ea" stroke-width="1"/>
  <text x="1" y="701" font-size="15" font-weight="600" fill="#171a1f">What you don't offer</text>
  <text x="1" y="721" font-size="13" font-weight="600" fill="#5b626c">A partner API</text>
  <text x="1" y="739" font-size="14" font-weight="400" fill="#5b626c">a 404, or a workaround the agent guesses</text>
  <rect x="1" y="751" width="358" height="70" rx="8" fill="#eaf3f0" stroke="#0d5c4a" stroke-width="1"/>
  <text x="13" y="771" font-size="13" font-weight="600" fill="#0d5c4a">With Poppy</text>
  <text x="13" y="789" font-size="14" font-weight="400" fill="#171a1f">/poppy/tasks lists it with an alternative;</text>
  <text x="13" y="807" font-size="14" font-weight="400" fill="#171a1f">/poppy/feedback reports the gap</text>
</svg>
