<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 539" font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">
  <rect x="1" y="1" width="718" height="165" rx="8" fill="#eaf3f0" stroke="#0d5c4a" stroke-width="1"/>
  <text x="17" y="27" font-size="16" font-weight="600" fill="#0d5c4a">Built in Iris and all five companies</text>
  <rect x="17" y="41" width="88.04" height="31" rx="4" fill="#ffffff" stroke="#0d5c4a" stroke-width="1"/>
  <text x="61.02" y="61.4" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">Discovery</text>
  <rect x="113.04" y="41" width="125.84" height="31" rx="4" fill="#ffffff" stroke="#0d5c4a" stroke-width="1"/>
  <text x="175.96" y="61.4" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">Agent identity</text>
  <rect x="246.88" y="41" width="125.84" height="31" rx="4" fill="#ffffff" stroke="#0d5c4a" stroke-width="1"/>
  <text x="309.8" y="61.4" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">Direct Sign-In</text>
  <rect x="380.72" y="41" width="103.16" height="31" rx="4" fill="#ffffff" stroke="#0d5c4a" stroke-width="1"/>
  <text x="432.3" y="61.4" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">DPoP tokens</text>
  <rect x="491.88" y="41" width="95.6" height="31" rx="4" fill="#ffffff" stroke="#0d5c4a" stroke-width="1"/>
  <text x="539.68" y="61.4" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">Revocation</text>
  <rect x="595.48" y="41" width="80.48" height="31" rx="4" fill="#ffffff" stroke="#0d5c4a" stroke-width="1"/>
  <text x="635.72" y="61.4" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">Sessions</text>
  <rect x="17" y="80" width="72.92" height="31" rx="4" fill="#ffffff" stroke="#0d5c4a" stroke-width="1"/>
  <text x="53.46" y="100.4" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">OpenAPI</text>
  <rect x="97.92" y="80" width="42.68" height="31" rx="4" fill="#ffffff" stroke="#0d5c4a" stroke-width="1"/>
  <text x="119.26" y="100.4" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">MCP</text>
  <rect x="148.6" y="80" width="118.28" height="31" rx="4" fill="#ffffff" stroke="#0d5c4a" stroke-width="1"/>
  <text x="207.74" y="100.4" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">Conversations</text>
  <rect x="274.88" y="80" width="72.92" height="31" rx="4" fill="#ffffff" stroke="#0d5c4a" stroke-width="1"/>
  <text x="311.34" y="100.4" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">Handoff</text>
  <rect x="355.8" y="80" width="171.2" height="31" rx="4" fill="#ffffff" stroke="#0d5c4a" stroke-width="1"/>
  <text x="441.4" y="100.4" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">Direct Conversations</text>
  <rect x="535" y="80" width="156.08" height="31" rx="4" fill="#ffffff" stroke="#0d5c4a" stroke-width="1"/>
  <text x="613.04" y="100.4" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">Tasks and feedback</text>
  <rect x="17" y="119" width="118.28" height="31" rx="4" fill="#ffffff" stroke="#0d5c4a" stroke-width="1"/>
  <text x="76.14" y="139.4" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">Operations v3</text>
  <rect x="143.28" y="119" width="178.76" height="31" rx="4" fill="#ffffff" stroke="#0d5c4a" stroke-width="1"/>
  <text x="232.66" y="139.4" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">Standing instructions</text>
  <rect x="330.04" y="119" width="193.88" height="31" rx="4" fill="#ffffff" stroke="#0d5c4a" stroke-width="1"/>
  <text x="426.98" y="139.4" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">FDX and ESPI extensions</text>
  <rect x="1" y="178" width="718" height="150" rx="8" fill="none" stroke="#0d5c4a" stroke-width="1"/>
  <text x="17" y="204" font-size="16" font-weight="600" fill="#171a1f">Built on the companies' side</text>
  <rect x="17" y="218" width="222" height="94" rx="6" fill="#ffffff" stroke="#0d5c4a" stroke-width="1.2"/>
  <text x="31" y="244" font-size="15" font-weight="600" fill="#171a1f">Browser join</text>
  <text x="31" y="263" font-size="14" font-weight="400" fill="#5b626c">on all five websites;</text>
  <text x="31" y="281" font-size="14" font-weight="400" fill="#5b626c">Iris drives no browser</text>
  <rect x="249" y="218" width="222" height="94" rx="6" fill="#ffffff" stroke="#0d5c4a" stroke-width="1.2"/>
  <text x="263" y="244" font-size="15" font-weight="600" fill="#171a1f">Skills</text>
  <text x="263" y="263" font-size="14" font-weight="400" fill="#5b626c">published by all five;</text>
  <text x="263" y="281" font-size="14" font-weight="400" fill="#5b626c">Iris lists them without</text>
  <text x="263" y="299" font-size="14" font-weight="400" fill="#5b626c">loading them</text>
  <rect x="481" y="218" width="222" height="94" rx="6" fill="#ffffff" stroke="#0d5c4a" stroke-width="1.2"/>
  <text x="495" y="244" font-size="15" font-weight="600" fill="#171a1f">Device Sign-In</text>
  <text x="495" y="263" font-size="14" font-weight="400" fill="#5b626c">at all but Harborline;</text>
  <text x="495" y="281" font-size="14" font-weight="400" fill="#5b626c">the playground uses</text>
  <text x="495" y="299" font-size="14" font-weight="400" fill="#5b626c">Direct Sign-In</text>
  <rect x="1" y="340" width="718" height="151" rx="8" fill="none" stroke="#c9ced5" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="17" y="366" font-size="16" font-weight="600" fill="#171a1f">Left out on both sides</text>
  <rect x="17" y="380" width="222" height="95" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="31" y="406" font-size="15" font-weight="600" fill="#171a1f">Mediated Sign-In</text>
  <text x="31" y="425" font-size="14" font-weight="400" fill="#5b626c">retires on 17 March 2027</text>
  <rect x="249" y="380" width="222" height="95" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="263" y="406" font-size="15" font-weight="600" fill="#171a1f">Operations on website</text>
  <text x="263" y="425" font-size="15" font-weight="600" fill="#171a1f">forms</text>
  <text x="263" y="444" font-size="14" font-weight="400" fill="#5b626c">joined browsers only read</text>
  <rect x="481" y="380" width="222" height="95" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="495" y="406" font-size="15" font-weight="600" fill="#171a1f">Several protocol</text>
  <text x="495" y="425" font-size="15" font-weight="600" fill="#171a1f">versions</text>
  <text x="495" y="444" font-size="14" font-weight="400" fill="#5b626c">the companies serve 1.0</text>
  <text x="495" y="462" font-size="14" font-weight="400" fill="#5b626c">only</text>
  <text x="1" y="515" font-size="14" font-weight="400" fill="#5b626c">Checked on the live companies by the official implementation kit's validator, and by the lab's</text>
  <text x="1" y="533" font-size="14" font-weight="400" fill="#5b626c">own suites where it doesn't reach, such as consent pages and the extensions.</text>
</svg>
