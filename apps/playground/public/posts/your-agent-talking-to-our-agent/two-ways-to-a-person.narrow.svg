<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 573.2" font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">
  <text x="1" y="17" font-size="15" font-weight="600" fill="#171a1f">A person at the company</text>
  <rect x="1" y="31" width="358" height="52.2" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="13" y="54.2" font-size="14" font-weight="600" fill="#171a1f">Either side asks for a person</text>
  <text x="13" y="72.2" font-size="13" font-weight="400" fill="#5b626c">a handoff request; handoff becomes pending</text>
  <path d="M25 83.2L25 95.2" fill="none" stroke="#0d5c4a" stroke-width="1.5"/>
  <path d="M25 103.2L20.5 95.2L29.5 95.2Z" fill="#0d5c4a"/>
  <rect x="1" y="103.2" width="358" height="91.2" rx="6" fill="#f4f6f7" stroke="#171a1f" stroke-width="1.2"/>
  <text x="13" y="126.4" font-size="14" font-weight="600" fill="#171a1f">A staff member joins</text>
  <text x="13" y="144.4" font-size="13" font-weight="400" fill="#5b626c">responder becomes human</text>
  <text x="13" y="166.4" font-size="13" font-weight="400" fill="#5b626c">If no one is available, the Company Agent says</text>
  <text x="13" y="183.4" font-size="13" font-weight="400" fill="#5b626c">why; Lantern gives its phone number.</text>
  <text x="1" y="238.4" font-size="15" font-weight="600" fill="#171a1f">The user themself</text>
  <rect x="1" y="252.4" width="358" height="52.2" rx="6" fill="#f4f6f7" stroke="#171a1f" stroke-width="1.2"/>
  <text x="13" y="275.6" font-size="14" font-weight="600" fill="#171a1f">The company asks for the user</text>
  <text x="13" y="293.6" font-size="13" font-weight="400" fill="#5b626c">a user_requested event, with its reason</text>
  <path d="M25 304.6L25 316.6" fill="none" stroke="#0d5c4a" stroke-width="1.5"/>
  <path d="M25 324.6L20.5 316.6L29.5 316.6Z" fill="#0d5c4a"/>
  <rect x="1" y="324.6" width="358" height="69.2" rx="6" fill="#fff6d6" stroke="#f2b705" stroke-width="1"/>
  <text x="13" y="347.8" font-size="14" font-weight="600" fill="#171a1f">Only the user can accept</text>
  <text x="13" y="365.8" font-size="13" font-weight="400" fill="#3a4049">the agent asks them, and starts nothing on its</text>
  <text x="13" y="382.8" font-size="13" font-weight="400" fill="#3a4049">own</text>
  <path d="M25 393.8L25 405.8" fill="none" stroke="#0d5c4a" stroke-width="1.5"/>
  <path d="M25 413.8L20.5 405.8L29.5 405.8Z" fill="#0d5c4a"/>
  <rect x="1" y="413.8" width="358" height="69.2" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="13" y="437" font-size="14" font-weight="600" fill="#171a1f">A Direct Conversation opens</text>
  <text x="13" y="455" font-size="13" font-weight="400" fill="#5b626c">the company speaks first; the user's words go</text>
  <text x="13" y="472" font-size="13" font-weight="400" fill="#5b626c">as written</text>
  <path d="M25 483L25 495" fill="none" stroke="#0d5c4a" stroke-width="1.5"/>
  <path d="M25 503L20.5 495L29.5 495Z" fill="#0d5c4a"/>
  <rect x="1" y="503" width="358" height="69.2" rx="6" fill="none" stroke="#c9ced5" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="13" y="526.2" font-size="14" font-weight="600" fill="#171a1f">The agent steps aside</text>
  <text x="13" y="544.2" font-size="13" font-weight="400" fill="#5b626c">its messages to the first conversation get</text>
  <text x="13" y="561.2" font-size="13" font-weight="400" fill="#5b626c">direct_conversation_open</text>
</svg>
