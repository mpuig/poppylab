<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 587" font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">
  <rect x="1" y="1" width="358" height="74" rx="8" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="15" y="27" font-size="15" font-weight="600" fill="#171a1f">Personal Agent</text>
  <text x="15" y="45" font-size="13" font-weight="400" fill="#5b626c">any model, prompt loop or SDK; Iris runs</text>
  <text x="15" y="62" font-size="13" font-weight="400" fill="#5b626c">OpenAI, Anthropic, Google, Ollama or no model</text>
  <line x1="41" y1="96" x2="53" y2="96" stroke="#c9ced5" stroke-width="1.5"/>
  <text x="63" y="101" font-size="14" font-weight="600" fill="#171a1f">Not an agent framework</text>
  <text x="63" y="120" font-size="13" font-weight="400" fill="#5b626c">nothing to adopt on the agent's side</text>
  <path d="M21 83L21 140" fill="none" stroke="#0d5c4a" stroke-width="1.5"/>
  <path d="M21 148L16.5 140L25.5 140Z" fill="#0d5c4a"/>
  <path d="M21 75L25.5 83L16.5 83Z" fill="#0d5c4a"/>
  <rect x="1" y="148" width="358" height="74" rx="8" fill="#eaf3f0" stroke="#0d5c4a" stroke-width="1.2"/>
  <text x="15" y="174" font-size="15" font-weight="600" fill="#0d5c4a">Poppy</text>
  <text x="15" y="192" font-size="13" font-weight="400" fill="#3a4049">discovery, identity, consent, Sessions and</text>
  <text x="15" y="209" font-size="13" font-weight="400" fill="#3a4049">approvals</text>
  <line x1="41" y1="243" x2="53" y2="243" stroke="#c9ced5" stroke-width="1.5"/>
  <text x="63" y="248" font-size="14" font-weight="600" fill="#171a1f">Not a marketplace or directory</text>
  <text x="63" y="267" font-size="13" font-weight="400" fill="#5b626c">poppy.json and each client_id live on</text>
  <text x="63" y="285" font-size="13" font-weight="400" fill="#5b626c">their owners' domains</text>
  <line x1="41" y1="312" x2="53" y2="312" stroke="#c9ced5" stroke-width="1.5"/>
  <text x="63" y="317" font-size="14" font-weight="600" fill="#171a1f">Not a chatbot</text>
  <text x="63" y="336" font-size="13" font-weight="400" fill="#5b626c">Conversations is a channel; the company's</text>
  <text x="63" y="354" font-size="13" font-weight="400" fill="#5b626c">agent can be plain code</text>
  <path d="M21 230L21 374" fill="none" stroke="#0d5c4a" stroke-width="1.5"/>
  <path d="M21 382L16.5 374L25.5 374Z" fill="#0d5c4a"/>
  <path d="M21 222L25.5 230L16.5 230Z" fill="#0d5c4a"/>
  <rect x="1" y="382" width="358" height="74" rx="8" fill="#f4f6f7" stroke="#171a1f" stroke-width="1.2"/>
  <text x="15" y="408" font-size="15" font-weight="600" fill="#171a1f">The company's own systems</text>
  <text x="15" y="426" font-size="13" font-weight="400" fill="#5b626c">its API, MCP server, support and website; its</text>
  <text x="15" y="443" font-size="13" font-weight="400" fill="#5b626c">catalog, ledger and payments</text>
  <line x1="41" y1="477" x2="53" y2="477" stroke="#c9ced5" stroke-width="1.5"/>
  <text x="63" y="482" font-size="14" font-weight="600" fill="#171a1f">Not a payments network</text>
  <text x="63" y="501" font-size="13" font-weight="400" fill="#5b626c">payments, fraud checks and settlement stay</text>
  <text x="63" y="519" font-size="13" font-weight="400" fill="#5b626c">in the company's stack</text>
  <line x1="41" y1="546" x2="53" y2="546" stroke="#c9ced5" stroke-width="1.5"/>
  <text x="63" y="551" font-size="14" font-weight="600" fill="#171a1f">Not a replacement for its APIs</text>
  <text x="63" y="570" font-size="13" font-weight="400" fill="#5b626c">it wraps the interfaces already there</text>
</svg>
