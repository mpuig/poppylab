<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 302" font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">
  <rect x="1" y="1" width="200" height="300" rx="8" fill="#eaf3f0" stroke="#0d5c4a" stroke-width="1.2"/>
  <text x="17" y="26.6" font-size="16" font-weight="600" fill="#0d5c4a">Poppy handles</text>
  <line x1="17" y1="41" x2="185" y2="41" stroke="#9cc7bb" stroke-width="1"/>
  <text x="17" y="67.75" font-size="15" font-weight="600" fill="#171a1f">Discovery</text>
  <text x="17" y="87.75" font-size="14" font-weight="400" fill="#5b626c">the bank, its issuer</text>
  <text x="17" y="104.75" font-size="14" font-weight="400" fill="#5b626c">and its URLs</text>
  <line x1="17" y1="120" x2="185" y2="120" stroke="#9cc7bb" stroke-width="1"/>
  <text x="17" y="146.75" font-size="15" font-weight="600" fill="#171a1f">Who the agent and</text>
  <text x="17" y="165.75" font-size="15" font-weight="600" fill="#171a1f">user are</text>
  <text x="17" y="185.75" font-size="14" font-weight="400" fill="#5b626c">client metadata and</text>
  <text x="17" y="202.75" font-size="14" font-weight="400" fill="#5b626c">the Session</text>
  <line x1="17" y1="218" x2="185" y2="218" stroke="#9cc7bb" stroke-width="1"/>
  <text x="17" y="244.75" font-size="15" font-weight="600" fill="#171a1f">Signing in</text>
  <text x="17" y="264.75" font-size="14" font-weight="400" fill="#5b626c">scopes, refresh,</text>
  <text x="17" y="281.75" font-size="14" font-weight="400" fill="#5b626c">revocation</text>
  <rect x="217" y="1" width="232" height="300" rx="8" fill="#ffffff" stroke="#0d5c4a" stroke-width="1.2"/>
  <text x="233" y="26.6" font-size="16" font-weight="600" fill="#0d5c4a">The extension adds</text>
  <line x1="233" y1="41" x2="433" y2="41" stroke="#9cc7bb" stroke-width="1"/>
  <text x="233" y="67.75" font-size="15" font-weight="600" fill="#171a1f">FDX's consent clusters</text>
  <text x="233" y="87.75" font-size="14" font-weight="400" fill="#5b626c">as scopes, the same at</text>
  <text x="233" y="104.75" font-size="14" font-weight="400" fill="#5b626c">every bank</text>
  <line x1="233" y1="120" x2="433" y2="120" stroke="#9cc7bb" stroke-width="1"/>
  <text x="233" y="146.75" font-size="15" font-weight="600" fill="#171a1f">Which accounts are</text>
  <text x="233" y="165.75" font-size="15" font-weight="600" fill="#171a1f">shared</text>
  <text x="233" y="185.75" font-size="14" font-weight="400" fill="#5b626c">chosen at consent, for the</text>
  <text x="233" y="202.75" font-size="14" font-weight="400" fill="#5b626c">whole grant</text>
  <line x1="233" y1="218" x2="433" y2="218" stroke="#9cc7bb" stroke-width="1"/>
  <text x="233" y="244.75" font-size="15" font-weight="600" fill="#171a1f">A consent record</text>
  <text x="233" y="264.75" font-size="14" font-weight="400" fill="#5b626c">tied to the grant; begins</text>
  <text x="233" y="281.75" font-size="14" font-weight="400" fill="#5b626c">and ends with it</text>
  <rect x="529" y="1" width="190" height="223" rx="8" fill="#f4f6f7" stroke="#171a1f" stroke-width="1.2"/>
  <text x="545" y="26.6" font-size="16" font-weight="600" fill="#171a1f">The bank keeps</text>
  <line x1="545" y1="41" x2="703" y2="41" stroke="#c9ced5" stroke-width="1"/>
  <text x="545" y="67.75" font-size="15" font-weight="600" fill="#171a1f">Accounts,</text>
  <text x="545" y="86.75" font-size="15" font-weight="600" fill="#171a1f">transactions,</text>
  <text x="545" y="105.75" font-size="15" font-weight="600" fill="#171a1f">statements</text>
  <text x="545" y="125.75" font-size="14" font-weight="400" fill="#5b626c">the FDX-shaped API</text>
  <line x1="545" y1="141" x2="703" y2="141" stroke="#c9ced5" stroke-width="1"/>
  <text x="545" y="167.75" font-size="15" font-weight="600" fill="#171a1f">Moving money</text>
  <text x="545" y="187.75" font-size="14" font-weight="400" fill="#5b626c">the bank's own API,</text>
  <text x="545" y="204.75" font-size="14" font-weight="400" fill="#5b626c">with Operations v3</text>
  <path d="M449 21L521 21" fill="none" stroke="#0d5c4a" stroke-width="1.5"/>
  <path d="M529 21L521 25.5L521 16.5Z" fill="#0d5c4a"/>
  <text x="489" y="13" text-anchor="middle" font-size="14" font-weight="400" fill="#5b626c">points at</text>
</svg>
