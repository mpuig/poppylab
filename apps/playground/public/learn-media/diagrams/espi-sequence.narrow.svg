  <path d="M304 666L296 661.5L296 670.5Z" fill="#0d5c4a"/>
  <rect x="197.36" y="634" width="157.64" height="28" rx="4" fill="#ffffff"/>
  <text x="348" y="654" text-anchor="end" font-size="14" font-weight="500" fill="#171a1f">7 · Reads the bills</text>
  <line x1="180" y1="742" x2="296" y2="742" stroke="#0d5c4a" stroke-width="1.5"/>
  <path d="M304 742L296 737.5L296 746.5Z" fill="#0d5c4a"/>
  <rect x="189.8" y="692" width="165.2" height="46" rx="4" fill="#ffffff"/>
  <text x="348" y="712" text-anchor="end" font-size="14" font-weight="500" fill="#171a1f">8 · Asks for a meter</text>
  <text x="348" y="730" text-anchor="end" font-size="14" font-weight="500" fill="#171a1f">not shared</text>
  <line x1="304" y1="800" x2="188" y2="800" stroke="#0d5c4a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M180 800L188 795.5L188 804.5Z" fill="#0d5c4a"/>
  <rect x="144.44" y="768" width="210.56" height="28" rx="4" fill="#ffffff"/>
  <text x="348" y="788" text-anchor="end" font-size="14" font-weight="500" fill="#171a1f">404, as if it didn't exist</text>
