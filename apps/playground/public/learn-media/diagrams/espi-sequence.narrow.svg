  <rect x="182.24" y="62" width="172.76" height="46" rx="4" fill="#ffffff"/>
  <text x="348" y="82" text-anchor="end" font-size="14" font-weight="500" fill="#171a1f">1 · The utility lists</text>
  <text x="348" y="100" text-anchor="end" font-size="14" font-weight="500" fill="#171a1f">poppylab.dev/espi</text>
  <line x1="180" y1="188" x2="296" y2="188" stroke="#0d5c4a" stroke-width="1.5"/>
