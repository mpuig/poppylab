  <text x="12" y="846" text-anchor="start" font-size="14" font-weight="600" fill="#171a1f">9 · User revokes,</text>
  <text x="12" y="864" text-anchor="start" font-size="14" font-weight="600" fill="#171a1f">in the agent</text>
  <line x1="180" y1="934" x2="296" y2="934" stroke="#0d5c4a" stroke-width="1.5"/>
