  <rect x="5" y="290" width="150.08" height="46" rx="4" fill="#fff6d6" stroke="#f2b705" stroke-width="1"/>
  <text x="12" y="310" text-anchor="start" font-size="14" font-weight="600" fill="#171a1f">3 · User signs in,</text>
  <text x="12" y="328" text-anchor="start" font-size="14" font-weight="600" fill="#171a1f">picks meters</text>
  <line x1="304" y1="416" x2="188" y2="416" stroke="#0d5c4a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M180 416L188 411.5L188 420.5Z" fill="#0d5c4a"/>
  <rect x="182.24" y="366" width="172.76" height="46" rx="4" fill="#ffffff"/>
  <text x="348" y="386" text-anchor="end" font-size="14" font-weight="500" fill="#171a1f">4 · The token carries</text>
  <text x="348" y="404" text-anchor="end" font-size="14" font-weight="500" fill="#171a1f">the subscription</text>
  <line x1="180" y1="474" x2="296" y2="474" stroke="#0d5c4a" stroke-width="1.5"/>
  <path d="M304 474L296 469.5L296 478.5Z" fill="#0d5c4a"/>
  <rect x="197.36" y="442" width="157.64" height="28" rx="4" fill="#ffffff"/>
  <text x="348" y="462" text-anchor="end" font-size="14" font-weight="500" fill="#171a1f">5 · Finds the meter</text>
  <line x1="304" y1="550" x2="188" y2="550" stroke="#0d5c4a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M180 550L188 545.5L188 554.5Z" fill="#0d5c4a"/>
  <rect x="197.36" y="500" width="157.64" height="46" rx="4" fill="#ffffff"/>
  <text x="348" y="520" text-anchor="end" font-size="14" font-weight="500" fill="#171a1f">Only the EV charger</text>
  <text x="348" y="538" text-anchor="end" font-size="14" font-weight="500" fill="#171a1f">is listed</text>
  <line x1="180" y1="608" x2="296" y2="608" stroke="#0d5c4a" stroke-width="1.5"/>
  <path d="M304 608L296 603.5L296 612.5Z" fill="#0d5c4a"/>
  <rect x="136.88" y="576" width="218.12" height="28" rx="4" fill="#ffffff"/>
  <text x="348" y="596" text-anchor="end" font-size="14" font-weight="500" fill="#171a1f">6 · Reads last week's usage</text>
