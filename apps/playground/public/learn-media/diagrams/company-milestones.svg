<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">
  <text x="719" y="14" text-anchor="end" font-size="14" font-weight="400" fill="#5b626c">each adds to the ones before</text>
  <circle cx="23" cy="58" r="21.25" fill="#ffffff" stroke="#0d5c4a" stroke-width="1.5"/>
  <text x="23" y="65.5" text-anchor="middle" font-family="'STIX Two Text',Georgia,serif" font-size="21" font-weight="500" fill="#0d5c4a">0</text>
  <text x="68" y="63.6" font-size="16" font-weight="600" fill="#171a1f">Be found</text>
  <text x="68" y="83.25" font-size="15" font-weight="400" fill="#3a4049">One static file, with no sign-in, that tells agents who you are</text>
  <text x="68" y="103.25" font-size="15" font-weight="400" fill="#3a4049">and what exists.</text>
  <text x="68" y="121.9" font-size="14" font-weight="400" fill="#5b626c">Stop here if you only want to be found.</text>
  <rect x="622" y="50" width="16" height="16" rx="3" fill="#0d5c4a"/>
  <line x1="23" y1="88" x2="23" y2="128" stroke="#c9ced5" stroke-width="1.5"/>
  <circle cx="23" cy="158" r="21.25" fill="#ffffff" stroke="#0d5c4a" stroke-width="1.5"/>
  <text x="23" y="165.5" text-anchor="middle" font-family="'STIX Two Text',Georgia,serif" font-size="21" font-weight="500" fill="#0d5c4a">1</text>
  <text x="68" y="163.6" font-size="16" font-weight="600" fill="#171a1f">Foundation</text>
  <text x="68" y="183.25" font-size="15" font-weight="400" fill="#3a4049">Agents become identifiable: your metadata, a verified Session</text>
  <text x="68" y="203.25" font-size="15" font-weight="400" fill="#3a4049">header and a record of each Session.</text>
  <rect x="622" y="150" width="16" height="16" rx="3" fill="#9cc7bb"/>
  <rect x="642" y="150" width="16" height="16" rx="3" fill="#0d5c4a"/>
  <line x1="23" y1="188" x2="23" y2="228" stroke="#c9ced5" stroke-width="1.5"/>
  <circle cx="23" cy="258" r="21.25" fill="#ffffff" stroke="#0d5c4a" stroke-width="1.5"/>
  <text x="23" y="265.5" text-anchor="middle" font-family="'STIX Two Text',Georgia,serif" font-size="21" font-weight="500" fill="#0d5c4a">2</text>
  <text x="68" y="263.6" font-size="16" font-weight="600" fill="#171a1f">Interfaces</text>
  <text x="68" y="283.25" font-size="15" font-weight="400" fill="#3a4049">Anyone may see what you offer, signed out, through the</text>
  <text x="68" y="303.25" font-size="15" font-weight="400" fill="#3a4049">interfaces you already have.</text>
  <rect x="622" y="250" width="16" height="16" rx="3" fill="#9cc7bb"/>
  <rect x="642" y="250" width="16" height="16" rx="3" fill="#9cc7bb"/>
  <rect x="662" y="250" width="16" height="16" rx="3" fill="#0d5c4a"/>
  <line x1="23" y1="288" x2="23" y2="328" stroke="#c9ced5" stroke-width="1.5"/>
  <circle cx="23" cy="358" r="21.25" fill="#ffffff" stroke="#0d5c4a" stroke-width="1.5"/>
  <text x="23" y="365.5" text-anchor="middle" font-family="'STIX Two Text',Georgia,serif" font-size="21" font-weight="500" fill="#0d5c4a">3</text>
  <text x="68" y="363.6" font-size="16" font-weight="600" fill="#171a1f">Sign-in</text>
  <text x="68" y="383.25" font-size="15" font-weight="400" fill="#3a4049">A user can connect an agent you never registered, with OAuth on</text>
  <text x="68" y="403.25" font-size="15" font-weight="400" fill="#3a4049">your own pages.</text>
  <rect x="622" y="350" width="16" height="16" rx="3" fill="#9cc7bb"/>
  <rect x="642" y="350" width="16" height="16" rx="3" fill="#9cc7bb"/>
  <rect x="662" y="350" width="16" height="16" rx="3" fill="#9cc7bb"/>
  <rect x="682" y="350" width="16" height="16" rx="3" fill="#0d5c4a"/>
  <line x1="23" y1="388" x2="23" y2="428" stroke="#c9ced5" stroke-width="1.5"/>
  <circle cx="23" cy="458" r="21.25" fill="#ffffff" stroke="#0d5c4a" stroke-width="1.5"/>
  <text x="23" y="465.5" text-anchor="middle" font-family="'STIX Two Text',Georgia,serif" font-size="21" font-weight="500" fill="#0d5c4a">4</text>
  <text x="68" y="463.6" font-size="16" font-weight="600" fill="#171a1f">Operations</text>
  <text x="68" y="483.25" font-size="15" font-weight="400" fill="#3a4049">Every consequential change waits for the user's approval of its</text>
  <text x="68" y="503.25" font-size="15" font-weight="400" fill="#3a4049">exact terms.</text>
  <rect x="622" y="450" width="16" height="16" rx="3" fill="#9cc7bb"/>
  <rect x="642" y="450" width="16" height="16" rx="3" fill="#9cc7bb"/>
  <rect x="662" y="450" width="16" height="16" rx="3" fill="#9cc7bb"/>
  <rect x="682" y="450" width="16" height="16" rx="3" fill="#9cc7bb"/>
  <rect x="702" y="450" width="16" height="16" rx="3" fill="#0d5c4a"/>
</svg>
