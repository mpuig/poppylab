  <rect x="1" y="75" width="120" height="88" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="17" y="110.8" font-size="16" font-weight="600" fill="#171a1f">Proposed</text>
  <text x="17" y="130.4" font-size="14" font-weight="400" fill="#5b626c">waiting for</text>
  <text x="17" y="148.4" font-size="14" font-weight="400" fill="#5b626c">approval</text>
  <rect x="463" y="1" width="256" height="72" rx="6" fill="#eaf3f0" stroke="#0d5c4a" stroke-width="1.2"/>
  <text x="479" y="37.8" font-size="16" font-weight="600" fill="#171a1f">Made once</text>
  <text x="479" y="57.4" font-size="14" font-weight="400" fill="#3a4049">the change is performed</text>
  <rect x="463" y="83" width="256" height="72" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="479" y="110.8" font-size="16" font-weight="600" fill="#171a1f">Declined by the Company</text>
  <text x="479" y="130.4" font-size="14" font-weight="400" fill="#5b626c">approval_declined</text>
  <text x="479" y="148.4" font-size="14" font-weight="400" fill="#5b626c">final for that approval</text>
  <rect x="463" y="165" width="256" height="72" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="479" y="192.8" font-size="16" font-weight="600" fill="#171a1f">A new revision</text>
  <text x="479" y="212.4" font-size="14" font-weight="400" fill="#5b626c">the old approval</text>
  <text x="479" y="230.4" font-size="14" font-weight="400" fill="#5b626c">no longer applies</text>
  <rect x="463" y="263" width="256" height="72" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="479" y="299.8" font-size="16" font-weight="600" fill="#171a1f">Declined in the agent</text>
  <text x="479" y="319.4" font-size="14" font-weight="400" fill="#5b626c">the Company is not told</text>
  <rect x="463" y="369" width="256" height="72" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="479" y="396.8" font-size="16" font-weight="600" fill="#171a1f">Expired</text>
  <text x="479" y="416.4" font-size="14" font-weight="400" fill="#5b626c">nothing was done;</text>
  <text x="479" y="434.4" font-size="14" font-weight="400" fill="#5b626c">it can't be approved late</text>
  <text x="216.5" y="57" text-anchor="middle" font-size="14" font-weight="400" fill="#5b626c">or the agent, on</text>
  <text x="216.5" y="75" text-anchor="middle" font-size="14" font-weight="400" fill="#5b626c">an instruction</text>
  <text x="216.5" y="93" text-anchor="middle" font-size="14" font-weight="400" fill="#5b626c">the user gave it</text>
  <rect x="135.1" y="105" width="162.8" height="28" rx="4" fill="#fff6d6" stroke="#f2b705" stroke-width="1"/>
  <text x="216.5" y="124.25" text-anchor="middle" font-size="15" font-weight="600" fill="#171a1f">The user approves</text>
  <text x="216.5" y="155" text-anchor="middle" font-size="14" font-weight="400" fill="#5b626c">then the Company</text>
  <text x="216.5" y="173" text-anchor="middle" font-size="14" font-weight="400" fill="#5b626c">checks the approval</text>
  <text x="328" y="29" font-size="14" font-weight="400" fill="#5b626c">terms still match</text>
  <text x="328" y="111" font-size="14" font-weight="400" fill="#5b626c">Company declines</text>
  <text x="328" y="193" font-size="14" font-weight="400" fill="#5b626c">terms changed</text>
  <rect x="194.1" y="285" width="162.8" height="28" rx="4" fill="#fff6d6" stroke="#f2b705" stroke-width="1"/>
  <text x="275.5" y="304.25" text-anchor="middle" font-size="15" font-weight="600" fill="#171a1f">The user declines</text>
  <text x="251.5" y="397" text-anchor="middle" font-size="14" font-weight="400" fill="#5b626c">the time runs out</text>
  <text x="499" y="357" font-size="14" font-weight="400" fill="#5b626c">waits until it expires</text>
</svg>
