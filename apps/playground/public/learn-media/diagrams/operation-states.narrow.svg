  <rect x="1" y="1" width="220" height="72" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="17" y="28.8" font-size="16" font-weight="600" fill="#171a1f">Proposed</text>
  <text x="17" y="48.4" font-size="14" font-weight="400" fill="#5b626c">waiting for approval</text>
  <text x="17" y="66.4" font-size="14" font-weight="400" fill="#5b626c">of this revision</text>
  <rect x="65" y="174" width="294" height="52" rx="6" fill="#eaf3f0" stroke="#0d5c4a" stroke-width="1.2"/>
  <text x="81" y="200.8" font-size="16" font-weight="600" fill="#171a1f">Made once</text>
  <text x="81" y="220.4" font-size="14" font-weight="400" fill="#3a4049">the change is performed</text>
  <rect x="65" y="254" width="294" height="70" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="81" y="280.8" font-size="16" font-weight="600" fill="#171a1f">Declined by the Company</text>
  <text x="81" y="300.4" font-size="14" font-weight="400" fill="#5b626c">approval_declined</text>
  <text x="81" y="318.4" font-size="14" font-weight="400" fill="#5b626c">final for that approval</text>
  <rect x="65" y="352" width="294" height="52" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="81" y="378.8" font-size="16" font-weight="600" fill="#171a1f">A new revision</text>
  <text x="81" y="398.4" font-size="14" font-weight="400" fill="#5b626c">the old approval no longer applies</text>
  <rect x="65" y="452" width="294" height="52" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="81" y="478.8" font-size="16" font-weight="600" fill="#171a1f">Declined in the agent</text>
  <text x="81" y="498.4" font-size="14" font-weight="400" fill="#5b626c">the Company is not told</text>
  <rect x="65" y="564" width="294" height="72" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="81" y="591.8" font-size="16" font-weight="600" fill="#171a1f">Expired</text>
  <text x="81" y="611.4" font-size="14" font-weight="400" fill="#5b626c">nothing was done;</text>
  <text x="81" y="629.4" font-size="14" font-weight="400" fill="#5b626c">it can't be approved late</text>
  <rect x="53" y="85" width="153.28" height="28" rx="4" fill="#fff6d6" stroke="#f2b705" stroke-width="1"/>
  <text x="129.64" y="103.9" text-anchor="middle" font-size="14" font-weight="600" fill="#171a1f">The user approves</text>
  <text x="53" y="129" font-size="13" font-weight="400" fill="#5b626c">or the agent, on an instruction the user gave it</text>
  <text x="53" y="146" font-size="13" font-weight="400" fill="#5b626c">then the Company checks the approval</text>
  <text x="65" y="168" font-size="13" font-weight="400" fill="#5b626c">terms still match</text>
  <text x="65" y="248" font-size="13" font-weight="400" fill="#5b626c">Company declines</text>
  <text x="65" y="346" font-size="13" font-weight="400" fill="#5b626c">terms changed</text>
  <rect x="65" y="418" width="153.28" height="28" rx="4" fill="#fff6d6" stroke="#f2b705" stroke-width="1"/>
  <text x="141.64" y="436.9" text-anchor="middle" font-size="14" font-weight="600" fill="#171a1f">The user declines</text>
  <text x="65" y="558" font-size="13" font-weight="400" fill="#5b626c">the time runs out</text>
  <text x="322" y="528" text-anchor="end" font-size="13" font-weight="400" fill="#5b626c">waits until it expires</text>
</svg>
