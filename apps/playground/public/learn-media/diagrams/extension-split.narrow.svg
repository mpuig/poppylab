<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 670" font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">
  <rect x="1" y="1" width="358" height="224" rx="8" fill="#eaf3f0" stroke="#0d5c4a" stroke-width="1.2"/>
  <text x="17" y="26.25" font-size="15" font-weight="600" fill="#0d5c4a">Poppy handles</text>
  <line x1="17" y1="41" x2="343" y2="41" stroke="#9cc7bb" stroke-width="1"/>
  <text x="17" y="66.9" font-size="14" font-weight="600" fill="#171a1f">Discovery</text>
  <text x="17" y="85.9" font-size="13" font-weight="400" fill="#5b626c">the bank, its issuer and its URLs</text>
  <line x1="17" y1="101" x2="343" y2="101" stroke="#9cc7bb" stroke-width="1"/>
  <text x="17" y="126.9" font-size="14" font-weight="600" fill="#171a1f">Who the agent and user are</text>
  <text x="17" y="145.9" font-size="13" font-weight="400" fill="#5b626c">client metadata and the Session</text>
  <line x1="17" y1="161" x2="343" y2="161" stroke="#9cc7bb" stroke-width="1"/>
  <text x="17" y="186.9" font-size="14" font-weight="600" fill="#171a1f">Signing in</text>
  <text x="17" y="205.9" font-size="13" font-weight="400" fill="#5b626c">scopes, refresh, revocation</text>
  <rect x="1" y="241" width="358" height="224" rx="8" fill="#ffffff" stroke="#0d5c4a" stroke-width="1.2"/>
  <text x="17" y="266.25" font-size="15" font-weight="600" fill="#0d5c4a">The extension adds</text>
  <line x1="17" y1="281" x2="343" y2="281" stroke="#9cc7bb" stroke-width="1"/>
  <text x="17" y="306.9" font-size="14" font-weight="600" fill="#171a1f">FDX's consent clusters</text>
  <text x="17" y="325.9" font-size="13" font-weight="400" fill="#5b626c">as scopes, the same at every bank</text>
  <line x1="17" y1="341" x2="343" y2="341" stroke="#9cc7bb" stroke-width="1"/>
  <text x="17" y="366.9" font-size="14" font-weight="600" fill="#171a1f">Which accounts are shared</text>
  <text x="17" y="385.9" font-size="13" font-weight="400" fill="#5b626c">chosen at consent, for the whole grant</text>
  <line x1="17" y1="401" x2="343" y2="401" stroke="#9cc7bb" stroke-width="1"/>
  <text x="17" y="426.9" font-size="14" font-weight="600" fill="#171a1f">A consent record</text>
  <text x="17" y="445.9" font-size="13" font-weight="400" fill="#5b626c">tied to the grant; begins and ends with it</text>
  <path d="M33 465L33 497" fill="none" stroke="#0d5c4a" stroke-width="1.5"/>
  <path d="M33 505L28.5 497L37.5 497Z" fill="#0d5c4a"/>
  <text x="49" y="489.9" font-size="14" font-weight="400" fill="#5b626c">points at</text>
  <rect x="1" y="505" width="358" height="164" rx="8" fill="#f4f6f7" stroke="#171a1f" stroke-width="1.2"/>
  <text x="17" y="530.25" font-size="15" font-weight="600" fill="#171a1f">The bank keeps</text>
  <line x1="17" y1="545" x2="343" y2="545" stroke="#c9ced5" stroke-width="1"/>
  <text x="17" y="570.9" font-size="14" font-weight="600" fill="#171a1f">Accounts, transactions, statements</text>
  <text x="17" y="589.9" font-size="13" font-weight="400" fill="#5b626c">the FDX-shaped API</text>
  <line x1="17" y1="605" x2="343" y2="605" stroke="#c9ced5" stroke-width="1"/>
  <text x="17" y="630.9" font-size="14" font-weight="600" fill="#171a1f">Moving money</text>
  <text x="17" y="649.9" font-size="13" font-weight="400" fill="#5b626c">the bank's own API, with Operations v3</text>
</svg>
