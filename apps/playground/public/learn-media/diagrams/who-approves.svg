<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 338" font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">
  <path d="M320 29L320 53" fill="none" stroke="#0d5c4a" stroke-width="1.5"/>
  <path d="M320 61L315.5 53L324.5 53Z" fill="#0d5c4a"/>
  <path d="M151 105L224 105" fill="none" stroke="#0d5c4a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M232 105L224 109.5L224 100.5Z" fill="#0d5c4a"/>
  <path d="M320 145L320 205" fill="none" stroke="#0d5c4a" stroke-width="1.5"/>
  <path d="M320 213L315.5 205L324.5 205Z" fill="#0d5c4a"/>
  <path d="M404 105L531 105" fill="none" stroke="#0d5c4a" stroke-width="1.5"/>
  <path d="M539 105L531 109.5L531 100.5Z" fill="#0d5c4a"/>
  <path d="M591 145L591 205" fill="none" stroke="#0d5c4a" stroke-width="1.5"/>
  <path d="M591 213L586.5 205L595.5 205Z" fill="#0d5c4a"/>
  <rect x="1" y="65" width="150" height="80" rx="6" fill="#f4f6f7" stroke="#171a1f" stroke-width="1.2"/>
  <text x="17" y="105.8" font-size="16" font-weight="600" fill="#171a1f">Company</text>
  <text x="17" y="125.4" font-size="14" font-weight="400" fill="#5b626c">sends the terms</text>
  <rect x="236" y="65" width="168" height="80" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="252" y="96.8" font-size="16" font-weight="600" fill="#171a1f">Personal Agent</text>
  <text x="252" y="116.4" font-size="14" font-weight="400" fill="#5b626c">approves, or asks</text>
  <text x="252" y="134.4" font-size="14" font-weight="400" fill="#5b626c">the user</text>
  <rect x="543" y="65" width="176" height="80" rx="6" fill="#171a1f" stroke="#171a1f" stroke-width="1.2"/>
  <text x="559" y="96.8" font-size="16" font-weight="600" fill="#ffffff">The user</text>
  <text x="559" y="116.4" font-size="14" font-weight="400" fill="#c4c9d0">sees the Company's</text>
  <text x="559" y="134.4" font-size="14" font-weight="400" fill="#c4c9d0">name and the terms</text>
  <rect x="236" y="217" width="168" height="80" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="252" y="248.8" font-size="16" font-weight="600" fill="#171a1f">Agent approved</text>
  <text x="252" y="268.4" font-size="14" font-weight="400" fill="#5b626c">on the user's</text>
  <text x="252" y="286.4" font-size="14" font-weight="400" fill="#5b626c">instruction</text>
  <rect x="543" y="217" width="176" height="80" rx="6" fill="#ffffff" stroke="#171a1f" stroke-width="1.2"/>
  <text x="559" y="248.8" font-size="16" font-weight="600" fill="#171a1f">User approved</text>
  <text x="559" y="268.4" font-size="14" font-weight="400" fill="#5b626c">in the agent's own</text>
  <text x="559" y="286.4" font-size="14" font-weight="400" fill="#5b626c">interface</text>
  <text x="193.5" y="95" text-anchor="middle" font-size="14" font-weight="500" fill="#171a1f">the terms</text>
  <text x="473.5" y="59" text-anchor="middle" font-size="14" font-weight="400" fill="#5b626c">not covered,</text>
  <text x="473.5" y="77" text-anchor="middle" font-size="14" font-weight="400" fill="#5b626c">can't tell, or</text>
  <text x="473.5" y="95" text-anchor="middle" font-size="14" font-weight="400" fill="#5b626c">a new revision</text>
  <text x="332" y="177" font-size="14" font-weight="400" fill="#5b626c">code finds the exact</text>
  <text x="332" y="195" font-size="14" font-weight="400" fill="#5b626c">terms in the instruction</text>
  <rect x="188.2" y="1" width="263.6" height="28" rx="4" fill="#fff6d6" stroke="#f2b705" stroke-width="1"/>
  <text x="320" y="20.25" text-anchor="middle" font-size="15" font-weight="600" fill="#171a1f">An instruction the user wrote</text>
  <text x="464" y="20" font-size="14" font-weight="400" fill="#5b626c">not from anything the agent read</text>
  <rect x="509.6" y="167" width="162.8" height="28" rx="4" fill="#fff6d6" stroke="#f2b705" stroke-width="1"/>
  <text x="591" y="186.25" text-anchor="middle" font-size="15" font-weight="600" fill="#171a1f">The user approves</text>
  <rect x="1" y="205" width="215" height="132" rx="8" fill="none" stroke="#c9ced5" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="17" y="231" font-size="14" font-weight="600" fill="#3a4049">Never an approval</text>
  <line x1="17" y1="252" x2="27" y2="252" stroke="#c9ced5" stroke-width="1"/>
  <text x="35" y="257" font-size="14" font-weight="400" fill="#5b626c">A Company message</text>
  <text x="35" y="275" font-size="14" font-weight="400" fill="#5b626c">saying the user agreed</text>
  <line x1="17" y1="296" x2="27" y2="296" stroke="#c9ced5" stroke-width="1"/>
  <text x="35" y="301" font-size="14" font-weight="400" fill="#5b626c">The model deciding the</text>
  <text x="35" y="319" font-size="14" font-weight="400" fill="#5b626c">user would agree</text>
</svg>
