  <text x="336" y="674" text-anchor="end" font-size="14" font-weight="500" fill="#171a1f">as a message</text>
  <line x1="304" y1="762" x2="188" y2="762" stroke="#0d5c4a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M180 762L188 757.5L188 766.5Z" fill="#0d5c4a"/>
  <rect x="208.04" y="712" width="134.96" height="46" rx="4" fill="#ffffff"/>
