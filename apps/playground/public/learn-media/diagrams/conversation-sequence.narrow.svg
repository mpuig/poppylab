  <path d="M304 860L296 855.5L296 864.5Z" fill="#0d5c4a"/>
  <rect x="200.48" y="828" width="142.52" height="28" rx="4" fill="#ffffff"/>
  <text x="336" y="848" text-anchor="end" font-size="14" font-weight="500" fill="#171a1f">Asks for a person</text>
  <line x1="304" y1="936" x2="188" y2="936" stroke="#0d5c4a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M180 936L188 931.5L188 940.5Z" fill="#0d5c4a"/>
  <rect x="170.24" y="886" width="172.76" height="46" rx="4" fill="#ffffff"/>
