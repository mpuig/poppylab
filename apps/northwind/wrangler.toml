name = "northwind-air"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
routes = [{ pattern = "northwind.poppylab.dev", custom_domain = true }]
workers_dev = false

[vars]
PUBLIC_ORIGIN = "https://northwind.poppylab.dev"
PUBLIC_DOMAIN = "northwind.poppylab.dev"

[[durable_objects.bindings]]
name = "NORTHWIND"
class_name = "NorthwindCompany"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NorthwindCompany"]
