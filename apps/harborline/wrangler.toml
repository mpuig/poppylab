name = "harborline-bank"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
routes = [{ pattern = "harborline.poppylab.dev", custom_domain = true }]
workers_dev = false

[vars]
PUBLIC_ORIGIN = "https://harborline.poppylab.dev"
PUBLIC_DOMAIN = "harborline.poppylab.dev"

[[durable_objects.bindings]]
name = "HARBORLINE"
class_name = "HarborlineCompany"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HarborlineCompany"]
