name = "fernwick-power"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
routes = [{ pattern = "energy-demo.poppylab.dev", custom_domain = true }]
workers_dev = false

[vars]
PUBLIC_ORIGIN = "https://energy-demo.poppylab.dev"
PUBLIC_DOMAIN = "energy-demo.poppylab.dev"

[[durable_objects.bindings]]
name = "FERNWICK"
class_name = "FernwickCompany"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FernwickCompany"]
